# Central de Achados e Perdidos - UCSal

spring.application.name=central-achados-perdidos

# Banco H2 em modo arquivo: os dados persistem entre execucoes (RNF01)
spring.datasource.url=jdbc:h2:file:./data/achadosperdidos;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console H2 para inspecao durante o desenvolvimento
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

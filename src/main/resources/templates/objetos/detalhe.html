<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalhe do objeto — Central de Achados e Perdidos</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
    <h1>Detalhe do objeto</h1>

    <dl>
        <dt>Categoria</dt>
        <dd th:text="${objeto.categoria}"></dd>

        <dt>Descrição</dt>
        <dd th:text="${objeto.descricaoPublica}"></dd>

        <dt>Local onde foi encontrado</dt>
        <dd th:text="${objeto.nomeLocal}"></dd>

        <dt>Data do encontro</dt>
        <dd th:text="${objeto.dataEncontro}"></dd>

        <dt>Status</dt>
        <dd th:text="${objeto.status}"></dd>
    </dl>

    <section th:if="${objeto.status.name() == 'DISPONIVEL'}">
        <h2>Acha que esse objeto é seu?</h2>
        <form th:action="@{/objetos/{id}/solicitacoes(id=${objeto.id})}" method="post">
            <label for="provaPosse">Descreva uma característica que só o dono saberia (prova de posse)</label>
            <textarea id="provaPosse" name="provaPosse" required></textarea>
            <button type="submit">Solicitar recuperação</button>
        </form>
    </section>
    <p th:unless="${objeto.status.name() == 'DISPONIVEL'}">
        Este objeto não está disponível para solicitação de recuperação no momento.
    </p>

    <p><a th:href="@{/objetos}">Voltar à listagem</a></p>
</body>
</html>

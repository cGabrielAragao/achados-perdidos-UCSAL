<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Objetos disponíveis — Central de Achados e Perdidos</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
    <h1>Objetos disponíveis</h1>
    <p><a th:href="@{/objetos/novo}">Registrar objeto encontrado</a></p>

    <form method="get" th:action="@{/objetos}">
        <label for="categoria">Categoria</label>
        <select id="categoria" name="categoria">
            <option value="">Todas</option>
            <option th:each="c : ${categorias}"
                    th:value="${c}"
                    th:selected="${c == categoriaSelecionada}"
                    th:text="${c}"></option>
        </select>

        <label for="localId">Local</label>
        <select id="localId" name="localId">
            <option value="">Todos</option>
            <option th:each="l : ${locais}"
                    th:value="${l.id}"
                    th:selected="${l.id == localSelecionado}"
                    th:text="${l.nome}"></option>
        </select>

        <button type="submit">Filtrar</button>
        <a th:href="@{/objetos}">Limpar filtros</a>
    </form>

    <p th:if="${#lists.isEmpty(objetos)}">Nenhum objeto disponível com esse filtro.</p>

    <table th:unless="${#lists.isEmpty(objetos)}">
        <thead>
        <tr>
            <th>Categoria</th>
            <th>Descrição</th>
            <th>Local</th>
            <th>Data do encontro</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="objeto : ${objetos}">
            <td th:text="${objeto.categoria}"></td>
            <td th:text="${objeto.descricaoPublica}"></td>
            <td th:text="${objeto.nomeLocal}"></td>
            <td th:text="${objeto.dataEncontro}"></td>
            <td><a th:href="@{/objetos/{id}(id=${objeto.id})}">Ver detalhe</a></td>
        </tr>
        </tbody>
    </table>

    <p><a th:href="@{/}">Voltar ao início</a></p>
</body>
</html>
